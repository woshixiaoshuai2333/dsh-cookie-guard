<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Cookie Guard</title>
<style>
  /* 浅色（默认）。所有颜色都必须走变量：这套页面是独立文档，宿主的 CSS 变量
     传不进 iframe，深色只能在这里自带一份。 */
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e6e8ec;
    --text: #1f2328;
    --muted: #6b7280;
    --ok: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --accent: #2563eb;
    --btn-bg: #ffffff;
    --btn-primary-fg: #ffffff;
    --chip-bg: #eef0f3;
    --chip-fg: #9aa1ab;
    --tag-info-bg: #eef2ff;
    --tag-ok-bg: #ecfdf5;
    --tag-warn-bg: #fffbeb;
    --tag-bad-bg: #fef2f2;
    --skel: rgba(127, 127, 127, .18);
  }
  /* 深色。取值逐一对应 DSH 原生 ui-theme 的 alias token（不是任何主题皮肤的配色）：
       --bg          ← --dsw-alias-bg-base                 #151517
       --card        ← --dsw-alias-bg-layer-1              #232324
       --line        ← --dsw-alias-border-l2               #ffffff1f
       --text        ← --dsw-alias-label-primary           #f9fafb
       --muted       ← --dsw-alias-label-tertiary          #adb2b8
       --accent      ← --dsw-alias-state-business-primary  #7aaaff
       --ok          ← --dsw-alias-state-success-primary   #22c55e
       --warn        ← --dsw-alias-state-warn-primary      #f59e0b
       --bad         ← --dsw-alias-state-error-primary     #f25a5a
       --btn-bg      ← --dsw-alias-button-elevated-fill    #43454a
       --chip-bg     ← --dsw-alias-interactive-bg-hover    #ffffff14
       --chip-fg     ← --dsw-alias-label-secondary         #cfd3d6
       --tag-*-bg    ← --dsw-alias-state-*-tertiary        #233c2c / #27241f / #34415b
     皮肤（如 dsh-claude-style）覆盖的是同一批 token，所以两边观感一致。 */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151517;
    --card: #232324;
    --line: #ffffff1f;
    --text: #f9fafb;
    --muted: #adb2b8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #f25a5a;
    --accent: #7aaaff;
    --btn-bg: #43454a;
    --btn-primary-fg: #0f1115;
    --chip-bg: #ffffff14;
    --chip-fg: #cfd3d6;
    --tag-info-bg: #34415b;
    --tag-ok-bg: #233c2c;
    --tag-warn-bg: #27241f;
    --tag-bad-bg: #3a1d1d;
    --skel: rgba(255, 255, 255, .14);
  }
  /* 兜底：脚本没跑起来（或浏览器里禁用 JS）时也得跟随系统深色。
     块内变量必须与上面 [data-theme="dark"] 完全一致 —— 测试会逐项比对。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #151517;
      --card: #232324;
      --line: #ffffff1f;
      --text: #f9fafb;
      --muted: #adb2b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #f25a5a;
      --accent: #7aaaff;
      --btn-bg: #43454a;
      --btn-primary-fg: #0f1115;
      --chip-bg: #ffffff14;
      --chip-fg: #cfd3d6;
      --tag-info-bg: #34415b;
      --tag-ok-bg: #233c2c;
      --tag-warn-bg: #27241f;
      --tag-bad-bg: #3a1d1d;
      --skel: rgba(255, 255, 255, .14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 48px;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .ver { color: var(--muted); font-size: 12px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .hero {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 16px;
  }
  .hero .label { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .big { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .num { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .num.small { font-size: 36px; }
  .arrow { color: var(--muted); font-size: 26px; }
  .tag {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--tag-info-bg); color: var(--accent); font-weight: 600;
  }
  .tag.ok { background: var(--tag-ok-bg); color: var(--ok); }
  .tag.warn { background: var(--tag-warn-bg); color: var(--warn); }
  .tag.bad { background: var(--tag-bad-bg); color: var(--bad); }
  .hero .when { color: var(--muted); font-size: 13px; margin-top: 12px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px;
  }
  .card .k { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .v { font-size: 20px; font-weight: 650; }
  .card .v small { font-size: 12px; font-weight: 400; color: var(--muted); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n { font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; padding: 9px 16px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--text);
  }
  button:disabled { cursor: not-allowed; opacity: 1; }
  button:disabled, button.primary:disabled {
    background: var(--chip-bg); border-color: var(--line); color: var(--chip-fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-primary-fg); }
  button.ghost { background: transparent; border-style: dashed; }
  .hint { color: var(--muted); font-size: 12px; }

  footer { color: var(--muted); font-size: 12px; line-height: 1.8; }
  code { background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ok); margin-right: 6px; }
  .dot.off { background: var(--muted); }
</style>
<script>
/* ── 跟随宿主深浅色 ──────────────────────────────────────────────────
   这个页面是独立文档（由 webServer 单独托管），宿主的 --dsw-* 令牌和
   body[data-ds-dark-theme] 都传不进来，所以深色必须自己算：

   1. 宿主把主题放在 iframe 地址的 ?theme=dark|light 上（首帧就是对的颜色）；
   2. 之后宿主主题变了，用 postMessage 发一条 { type: 'cookie-guard:theme' }；
   3. 单独打开（浏览器 / 桌面快捷方式）时没人告诉我们，退回系统偏好。

   写的是 <html data-theme="dark">，CSS 里的 :root[data-theme="dark"] 生效；
   data-theme 为空时交给 @media (prefers-color-scheme: dark) 兜底。 */
(function () {
  var MESSAGE = 'cookie-guard:theme';
  var root = document.documentElement;
  var query = typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-color-scheme: dark)')
    : null;
  var fromHost = null;   // 宿主明确告知的主题；null = 还没人告诉我们

  function apply(theme) {
    if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme);
    else root.removeAttribute('data-theme');
  }

  function readFromUrl() {
    try {
      var want = new URLSearchParams(location.search).get('theme');
      if (want === 'dark' || want === 'light') return want;
    } catch (e) { /* 老浏览器没有 URLSearchParams */ }
    return null;
  }

  fromHost = readFromUrl();
  apply(fromHost);

  window.addEventListener('message', function (event) {
    var data = event && event.data;
    if (!data || data.type !== MESSAGE) return;
    if (data.theme !== 'dark' && data.theme !== 'light') return;
    fromHost = data.theme;
    apply(fromHost);
  });

  if (query) {
    var onSystemChange = function () {
      if (fromHost === null) apply(query.matches ? 'dark' : 'light');
    };
    if (typeof query.addEventListener === 'function') query.addEventListener('change', onSystemChange);
    else if (typeof query.addListener === 'function') query.addListener(onSystemChange);
  }
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DSH Cookie Guard</h1>
    <span class="ver" id="ver"></span>
  </header>
  <div class="sub">只看不改。所有数字都来自启动前体检写下的报告，不是估算。</div>

  <div class="hero" id="hero">
    <div class="label">上一次启动时的 dsh-auth cookie 条数</div>
    <div class="big">
      <span class="num" id="before">—</span>
      <span class="arrow">→</span>
      <span class="num small" id="after">—</span>
      <span class="tag" id="verdict">等待数据</span>
    </div>
    <div class="when" id="when">还没有报告，先用「DSH（带体检启动）」启动一次。</div>
  </div>

  <div class="grid">
    <div class="card"><div class="k">累计清理次数</div><div class="v" id="cleanCount">—</div></div>
    <div class="card"><div class="k">累计删除 cookie</div><div class="v" id="removedTotal">—</div></div>
    <div class="card"><div class="k">当前阈值 / 保留</div><div class="v" id="policy">—</div></div>
  </div>

  <div class="panel">
    <h2>最近记录</h2>
    <table>
      <thead>
        <tr><th>时间</th><th>结果</th><th>清理前</th><th>清理后</th><th>删除</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty">还没有任何记录</td></tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>操作</h2>
    <div class="actions">
      <button class="primary" id="cleanBtn" title="关闭 DSH → 清理 cookie → 自动重启">立即清理并重启</button>
      <button id="refreshBtn">刷新数据</button>
      <button id="installBtn" class="ghost" style="display:none" title="在桌面放一个「DSH（带体检启动）」快捷方式">安装启动器</button>
      <span class="hint" id="btnHint">会先把 DSH 关掉再清理（Cookies 被它独占着），然后自动拉起来。</span>
    </div>
    <div class="hint" id="launcherHint" style="margin-top:10px"></div>
  </div>

  <footer>
    <div><span class="dot" id="dot"></span><span id="conn">正在读取状态…</span></div>
    <div>报告文件：<code id="reportPath">—</code></div>
  </footer>
</div>

<script>
(function () {
  var BASE = '/cookie-guard';
  var STATUS_URL = BASE + '/api/status';
  var CLEAN_URL = BASE + '/api/clean';
  var timer = null;
  var closing = false; // 已发起「清理并重启」：DSH 正在退出，此时的 fetch 失败是预期内的

  function $(id) { return document.getElementById(id); }

  function statusTag(status) {
    if (status === 'cleaned') return { text: '已清理', cls: 'ok' };
    if (status === 'skipped') return { text: '未超阈值', cls: 'ok' };
    if (status === 'nothing-to-do') return { text: '无需清理', cls: 'ok' };
    if (status === 'locked') return { text: '被占用已跳过', cls: 'warn' };
    if (status === 'error') return { text: '出错', cls: 'bad' };
    return { text: status || '未知', cls: '' };
  }

  function render(data) {
    var rep = data.report || {};
    var history = Array.isArray(rep.history) ? rep.history : [];
    var last = rep.last || null;
    launcherReady = !!(data.launcher && data.launcher.installed);
    // 大卡片只认"真的数过"的记录：被占用跳过（locked）的条目没有 before/after，
    // 不该让整块变成「? → ?」，那样信息量为零。
    function hasNum(e) { return !!e && e.before !== null && e.before !== undefined; }
    var shown = history.slice().reverse().find(hasNum) || (hasNum(last) ? last : null);
    var skipped = (last && !hasNum(last)) ? last : null;

    $('reportPath').textContent = rep.path || '—';
    // 版本号由 /api/status 从 package.json 带过来，面板里不再写死（以前写死了 v0.2.0 就不会再变）。
    var ver = $('ver');
    if (ver && data.version) ver.textContent = 'v' + data.version;

    if (!shown) {
      $('before').textContent = '—';
      $('after').textContent = '—';
      $('verdict').textContent = last ? statusTag(last.status).text : '还没有数据';
      $('verdict').className = 'tag' + (last ? ' ' + statusTag(last.status).cls : '');
      $('when').textContent = last
        ? (last.local || last.ts || '') + '　（这次没拿到数字，' + statusTag(last.status).text + '）'
        : (launcherReady
          ? '还没有报告 —— 用桌面上的「DSH（带体检启动）」启动一次就会有了。'
          : '还没有报告 —— 先点下面「安装启动器」，之后用它启动 DSH 就会有了。');
      $('rows').innerHTML = '<tr><td colspan="5" class="empty">还没有任何记录</td></tr>';
    } else {
      $('before').textContent = shown.before;
      $('after').textContent = (shown.after === null || shown.after === undefined) ? '—' : shown.after;
      var t = statusTag(shown.status);
      $('verdict').textContent = t.text;
      $('verdict').className = 'tag ' + t.cls;
      var when = (shown.local || shown.ts || '') +
        (shown.removed ? '　删除了 ' + shown.removed + ' 条' : '') +
        (shown.durationMs ? '　耗时 ' + shown.durationMs + ' ms' : '');
      if (skipped) when += '　·　最近一次 ' + (skipped.local || skipped.ts || '') + ' 因 Cookies 被占用而跳过';
      $('when').textContent = when;

      var rows = history.slice(-12).reverse().map(function (e) {
        var tt = statusTag(e.status);
        return '<tr>' +
          '<td class="n">' + (e.local || e.ts || '') + '</td>' +
          '<td><span class="tag ' + tt.cls + '">' + tt.text + '</span></td>' +
          '<td class="n">' + (e.before ?? '—') + '</td>' +
          '<td class="n">' + (e.after ?? '—') + '</td>' +
          '<td class="n">' + (e.removed ?? '—') + '</td>' +
          '</tr>';
      }).join('');
      $('rows').innerHTML = rows || '<tr><td colspan="5" class="empty">还没有任何记录</td></tr>';
    }

    var cleaned = history.filter(function (e) { return e.status === 'cleaned' });
    $('cleanCount').textContent = cleaned.length;
    var removedTotal = cleaned.reduce(function (a, e) { return a + (e.removed || 0); }, 0);
    $('removedTotal').textContent = removedTotal;
    $('policy').innerHTML = (last && last.threshold != null ? last.threshold : '—') +
      ' <small>/ 保留 ' + (last && last.keep != null ? last.keep : 1) + '</small>';

    $('dot').className = 'dot';
    $('conn').textContent = '数据来自本地报告文件 · 最后读取 ' + (data.generatedAtLocal || '');
    renderLauncher(data.launcher);
  }

  // 启动器（桌面快捷方式）状态：没有它，报告永远是空的、平时启动也不会清理
  var launcherReady = false;
  function renderLauncher(l) {
    var btn = $('installBtn');
    var hint = $('launcherHint');
    if (!btn || !hint) return;
    if (!l) { btn.style.display = 'none'; return; }
    launcherReady = !!l.installed;
    if (l.installed) {
      btn.style.display = 'none';
      hint.innerHTML = '启动器已就位：以后用桌面上的「DSH（带体检启动）」启动，每次都会先清一次 cookie。' +
        '<br><code>' + (l.cmdPath || '') + '</code>';
    } else {
      btn.style.display = '';
      hint.innerHTML = '还没有启动器。装一个，以后双击桌面图标启动 DSH 就会自动体检（不装的话，只有点上面的按钮才会清理）。';
    }
  }

  function installLauncher() {
    var btn = $('installBtn');
    var hint = $('launcherHint');
    btn.disabled = true;
    hint.textContent = '正在创建…';
    fetch(BASE + '/api/install-launcher', { method: 'POST', cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        var b = res.body || {};
        if (res.status === 200 && b.ok) {
          launcherReady = true;
          btn.style.display = 'none';
          hint.innerHTML = '已创建：<code>' + (b.cmdPath || '') + '</code>' +
            (b.lnkCreated ? '<br>桌面快捷方式：<code>' + (b.lnkPath || '') + '</code>' : '') +
            ((b.notes && b.notes.length) ? '<br>· ' + b.notes.join('<br>· ') : '') +
            '<br><b>下次请用桌面上的「DSH（带体检启动）」启动。</b>';
        } else {
          hint.textContent = '创建失败：' + (b.error || b.message || ('HTTP ' + res.status));
        }
        load();
      })
      .catch(function (err) { btn.disabled = false; hint.textContent = '创建失败：' + err; });
  }

  function fail(err) {
    $('dot').className = 'dot off';
    if (closing) {
      // 点了「清理并重启」之后 DSH 会主动退出，这时候 fetch 必然失败 —— 这是预期内的，
      // 不该显示成红色的「读取失败」，否则用户会以为出错了。
      $('conn').textContent = 'DSH 已关闭，正在清理并重启 —— 本页已停止刷新，DSH 回来后重新打开即可。';
      $('verdict').textContent = '正在重启';
      $('verdict').className = 'tag';
      return;
    }
    $('conn').textContent = '读取失败：' + (err && err.message ? err.message : err);
    $('verdict').textContent = '连不上';
    $('verdict').className = 'tag bad';
  }

  function load() {
    return fetch(STATUS_URL, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(fail);
  }

  $('refreshBtn').addEventListener('click', load);
  $('cleanBtn').addEventListener('click', cleanNow);
  $('installBtn').addEventListener('click', installLauncher);
  load();
  timer = setInterval(load, 5000);
  window.addEventListener('beforeunload', function () { clearInterval(timer); });

  function cleanNow() {
    var btn = $('cleanBtn');
    var hint = $('btnHint');
    var ok = window.confirm(
      '现在会：\n' +
      '1. 关掉 DSH（当前这个对话窗口会跟着关闭）\n' +
      '2. 清掉多余的 dsh-auth cookie\n' +
      '3. 自动重新启动 DSH\n\n' +
      '如果这会儿正在跑任务，先等它跑完再点。继续吗？'
    );
    if (!ok) return;

    btn.disabled = true;
    hint.textContent = '正在发起…';

    fetch(CLEAN_URL, { method: 'POST', cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (res.body.simulated) {
          hint.textContent = '预览模式：这里不会真的重启（还是从 DSH 里打开才有这个效果）。';
          btn.disabled = false;
          return;
        }
        if (res.status === 202) {
          closing = true;
          clearInterval(timer); // DSH 马上要退出，再刷新只会刷出 Failed to fetch
          hint.textContent = '已发起：DSH 会在 2～3 秒内关闭，清理后自动重启。这个页面稍后会断开。';
          $('conn').textContent = '已发起清理，DSH 正在退出…';
          $('dot').className = 'dot off';
          return;
        }
        hint.textContent = '发起失败：' + (res.body && (res.body.message || res.body.error) || ('HTTP ' + res.status));
        btn.disabled = false;
      })
      .catch(function (err) {
        hint.textContent = '发起失败：' + (err && err.message ? err.message : err);
        btn.disabled = false;
      });
  }
})();
</script>
</body>
</html>
